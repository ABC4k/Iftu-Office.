<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-forget {
            background-color: #f39c12;
            color: white;
        }

        .btn-change {
            background-color: #2980b9;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Modal (Pop-up) Styling */
        .modal {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }

        .modal-content {
            background: #fff; 
            padding: 25px; 
            border-radius: 8px; 
            width: 90%; 
            max-width: 350px; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-content input {
            width: 100%; 
            padding: 10px; 
            margin: 8px 0; 
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .modal-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
        }

        .btn-modal {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-send { background: #27ae60; color: #fff; }
        .btn-cancel { background: #95a5a6; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔑 PIN System</h2>
        <button class="btn btn-forget" onclick="openForgetPinModal()">🔑 Forget PIN?</button>
        <button class="btn btn-change" onclick="openChangePinModal()">🔐 Change PIN</button>
    </div>

    <!-- Forget PIN Modal -->
    <div id="forgetPinModal" class="modal">
        <div class="modal-content">
            <h3>🔑 Forget PIN?</h3>
            <p>የቅርንጫፍዎን PIN ወደ Telegram ለመላክ ቅርንጫፍዎን መረጡና "ላክ" የሚለውን ይጫኑ።</p>
            <input type="text" id="forgetBranchInput" placeholder="የቅርንጫፍ ስም (Branch Name)">
            <div class="modal-buttons">
                <button class="btn-modal btn-send" onclick="submitForgetPin()">ላክ</button>
                <button class="btn-modal btn-cancel" onclick="closeModal('forgetPinModal')">ሰርዝ</button>
            </div>
        </div>
    </div>

    <!-- Change PIN Modal -->
    <div id="changePinModal" class="modal">
        <div class="modal-content">
            <h3>🔐 Change PIN</h3>
            <input type="password" id="oldPinInput" placeholder="የድሮ PIN">
            <input type="password" id="newPinInput" placeholder="አዲስ PIN">
            <div class="modal-buttons">
                <button class="btn-modal btn-send" onclick="submitChangePin()">ቀይር</button>
                <button class="btn-modal btn-cancel" onclick="closeModal('changePinModal')">ሰርዝ</button>
            </div>
        </div>
    </div>

    <script>
        // የቴሌግራም ቦት መረጃዎች (እነዚህን በራስህ Bot Token እና Chat ID ተካቸው)
        const TELEGRAM_BOT_TOKEN = "YOUR_TELEGRAM_BOT_TOKEN";
        const TELEGRAM_CHAT_ID = "YOUR_TELEGRAM_CHAT_ID";

        // Modals መክፈቻ Functions
        function openForgetPinModal() {
            document.getElementById('forgetPinModal').style.display = 'flex';
        }

        function openChangePinModal() {
            document.getElementById('changePinModal').style.display = 'flex';
        }

        // Modals መዝጊያ Function
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // ወደ ቴሌግራም መልእክት መላኪያ Function
        function sendToTelegram(message) {
            if (TELEGRAM_BOT_TOKEN === "YOUR_TELEGRAM_BOT_TOKEN") {
                alert("እባክዎን በቅድሚያ የTelegram Bot Token እና Chat ID ያስገቡ!");
                return;
            }

            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    alert("መልእክቱ ወደ Telegram በትክክል ተላክቷል!");
                } else {
                    alert("መልእክቱን መላክ አልተቻለም። Bot Token ወይም Chat ID ያረጋግጡ።");
                }
            })
            .catch(err => {
                console.error(err);
                alert("የኢንተርኔት ግንኙነት ችግር አለ!");
            });
        }

        // Forget PIN ማስገቢያ
        function submitForgetPin() {
            const branch = document.getElementById('forgetBranchInput').value;
            if (!branch) {
                alert("እባክዎን የቅርንጫፍ ስም ያስገቡ!");
                return;
            }

            const currentPin = localStorage.getItem('user_pin_' + branch) || "ያልተመዘገበ/መደበኛ PIN";
            const message = `🔑 *Forget PIN Request*\n\nBranch: ${branch}\nCurrent PIN: ${currentPin}`;

            sendToTelegram(message);
            closeModal('forgetPinModal');
            document.getElementById('forgetBranchInput').value = '';
        }

        // Change PIN ማስገቢያ
        function submitChangePin() {
            const oldPin = document.getElementById('oldPinInput').value;
            const newPin = document.getElementById('newPinInput').value;

            if (!oldPin || !newPin) {
                alert("እባክዎን የድሮውን እና አዲሱን PIN ያስገቡ!");
                return;
            }

            // አዲሱን PIN በLocal Storage ውስጥ ማስቀመጥ
            localStorage.setItem('user_pin', newPin);

            const message = `🔐 *PIN Changed Successfully*\n\nOld PIN: ${oldPin}\nNew PIN: ${newPin}`;

            sendToTelegram(message);
            closeModal('changePinModal');
            
            document.getElementById('oldPinInput').value = '';
            document.getElementById('newPinInput').value = '';
        }
    </script>
</body>
</html>
